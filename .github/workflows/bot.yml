name: Fortuna News Bot

on:
  schedule:
    - cron: "*/15 * * * *"   # alle 15 Minuten (GitHub kann sich um ein paar Minuten verspäten)
  workflow_dispatch:          # manueller Start über den "Run workflow"-Button

permissions:
  contents: write             # nötig, um seen.json zurückzuspeichern

concurrency:
  group: fortuna-bot
  cancel-in-progress: false

jobs:
  check-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Neue Artikel posten
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          FIRST_RUN_POSTS: "0"   # ohne seen.json nur merken, nichts doppelt posten
        run: python fortuna_bot.py --once

      - name: Gesehene Artikel speichern
        run: |
          git config user.name "fortuna-bot"
          git config user.email "fortuna-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "seen.json aktualisiert" && git push)
